name: Build VidFlow Desktop & Android Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Web Studio
        run: npm run build:app

      - name: Build Desktop (Windows .exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "VidFlow Desktop v__VERSION__"
          releaseBody: "VidFlow Official AI Motion Graphics Studio (Windows Desktop Release)"
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidflow-windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi

  build-mobile-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Set Android Environment Variables
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Web Assets
        run: npm run build:app

      - name: Init and Build Android APK
        run: |
          npm run tauri android init
          npm run tauri android build -- --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidflow-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
