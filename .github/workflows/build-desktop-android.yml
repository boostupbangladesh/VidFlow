name: Build VidFlow Desktop & Android Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Web Studio
        run: npm run build:app

      - name: Build Windows Installer with Tauri
        run: npm run tauri build

      - name: Upload Windows MSI / EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidflow-windows-release
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-mobile-android:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        run: |
          echo "Installing Android NDK..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Build Frontend Web Assets
        run: npm run build:app

      - name: Init and Build Android APK
        env:
          CI: "true"
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --ci

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidflow-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish-github-release:
    name: Publish Official GitHub Release
    needs: [build-desktop-windows, build-mobile-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vidflow-windows-release
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vidflow-android-release
          path: release-assets/android

      - name: Prepare Release Files
        run: |
          mkdir -p release-dist
          find release-assets/ -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.apk" \) -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "VidFlow v1.0.0 — Official Desktop & Android Release"
          body: |
            ## 🚀 VidFlow v1.0.0 Release (Windows & Android)
            Developed by **ZapyTeam** (WhatsApp: +8801911444546)

            ### 📦 Download Packages
            - **Windows Installer:** Download the `.msi` or `.exe` file below and run setup on your PC.
            - **Android Mobile:** Download the `.apk` file below and install it directly on your Android phone or tablet.

            ### ✨ Key Highlights
            - AI Prompt-to-Motion graphics generator (Google Gemini 3.8 Flash & Gemini Argon 4)
            - Bangla and English kinetic typography
            - Multi-track timeline & WYSIWYG canvas
            - Frame-accurate video export with voiceover & background music
            - Master PIN-protected Admin Commander (`7788`)
          draft: false
          prerelease: false
          files: release-dist/*
