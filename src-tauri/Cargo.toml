[package]
name = "vidflow"
version = "1.0.0"
description = "VidFlow - Commercial AI Motion Graphics Software developed by ZapyTeam"
authors = ["ZapyTeam <ashraf@zapyteam.com>"]
edition = "2021"

[lib]
name = "vidflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
